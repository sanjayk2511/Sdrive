<!DOCTYPE html>
<html>

<head>

<title>S-Drive Admin</title>

<style>

body{
font-family:arial;
background:#0f172a;
color:white;
text-align:center;
}

table{
width:95%;
margin:auto;
background:white;
color:black;
border-collapse:collapse;
}

th,td{
padding:10px;
border:1px solid #ddd;
}

button{
padding:6px 12px;
background:red;
color:white;
border:none;
}

</style>

</head>

<body>



<h2>Admin Panel</h2>

<input type="password" id="pass" placeholder="password">

<button onclick="login()">Login</button>



<div id="panel" style="display:none;">



<input placeholder="Search phone" onkeyup="search(this.value)">



<table id="table">

<tr>

<th>Name</th>

<th>Phone</th>

<th>City</th>

<th>Type</th>

<th>Photo</th>

<th>Status</th>

<th>Delete</th>

</tr>

</table>

</div>



<script>

const scriptURL="PASTE_WEB_APP_URL";

const password="1234";

var allData=[];



function login(){

if(pass.value==password){

panel.style.display="block";

load();

}

}



function load(){

fetch(scriptURL)

.then(r=>r.json())

.then(d=>{

allData=d;

render(d);

});

}



function render(data){

table.innerHTML=`<tr>

<th>Name</th>

<th>Phone</th>

<th>City</th>

<th>Type</th>

<th>Photo</th>

<th>Status</th>

<th>Delete</th>

</tr>`;



data.forEach(x=>{

table.innerHTML+=`

<tr>

<td>${x[0]}</td>

<td>${x[1]}</td>

<td>${x[2]}</td>

<td>${x[3]}</td>

<td>${x[4]}</td>



<td>

<select onchange="updateStatus('${x[1]}',this.value)">

<option ${x[5]=='Pending'?'selected':''}>Pending</option>

<option ${x[5]=='Selected'?'selected':''}>Selected</option>

<option ${x[5]=='Rejected'?'selected':''}>Rejected</option>

</select>

</td>



<td>

<button onclick="deleteRow('${x[1]}')">Delete</button>

</td>



</tr>`;

});

}



function search(val){

render(allData.filter(x=>x[1].includes(val)));

}



function updateStatus(phone,status){

fetch(scriptURL,{

method:"PUT",

body:JSON.stringify({phone,status})

});

}



function deleteRow(phone){

fetch(scriptURL,{

method:"DELETE",

body:JSON.stringify({phone})

})

.then(()=>load());

}

</script>



</body>

</html>
