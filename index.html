<!DOCTYPE html>
<html>

<head>

<title>S-Drive | Professional Driver Hiring</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:'Segoe UI';
margin:0;
background:linear-gradient(120deg,#0f172a,#1e293b);
color:white;
}

.header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.hero{
text-align:center;
padding:80px 20px;
}

.btn{
background:linear-gradient(90deg,#f97316,#fb923c);
border:none;
padding:14px 28px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;
margin:10px;
}

.section{
padding:40px;
text-align:center;
}

form{
max-width:420px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,select{
padding:12px;
border-radius:8px;
border:none;
}

.card{
background:white;
color:black;
padding:20px;
margin:10px;
border-radius:10px;
cursor:pointer;
}

.details{
background:white;
color:black;
padding:20px;
margin:20px auto;
max-width:500px;
border-radius:10px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
color:white;
border-radius:50px;
text-decoration:none;
}

.footer{
text-align:center;
padding:20px;
background:black;
margin-top:40px;
}

</style>

</head>

<body>

<div class="header">

S-Drive

</div>



<div class="hero">

<h1>Hire Professional Drivers</h1>

<p>Rental | Salary | Uber Fleet</p>

<button class="btn" onclick="showForm()">Apply Now</button>

<button class="btn" onclick="showLogin()">Admin</button>

</div>



<div id="formSection" class="section" style="display:none;">

<h2>Driver Application</h2>

<form onsubmit="submitForm(event)">

<input id="name" placeholder="Full Name" required>

<input id="phone" placeholder="Phone Number" required>

<input id="city" placeholder="City" required>

<select id="type" onchange="showDetails(this.value)" required>

<option value="">Select Driver Type</option>

<option value="rental">Rental</option>

<option value="salary">Salary</option>

<option value="uber">Uber</option>

</select>

<input type="file" id="license" required>

<button class="btn">Submit</button>

</form>

</div>



<div id="rental" class="details" style="display:none;">

Rental driver flexible earning model

</div>



<div id="salary" class="details" style="display:none;">

Salary driver fixed monthly income

</div>



<div id="uber" class="details" style="display:none;">

Uber fleet driver earning model

</div>



<div id="login" class="section" style="display:none;">

<h2>Admin Login</h2>

<input id="pass" placeholder="Password">

<button class="btn" onclick="login()">Login</button>

</div>



<a class="whatsapp" href="https://wa.me/917019300551">

WhatsApp

</a>



<div class="footer">

© S-Drive

</div>



<script>

const scriptURL="https://script.google.com/macros/s/AKfycbynZw4PGrX6PFaBf9y6S0a98r_0dcGpEHv4TSscofv7PbU2i9IQufNfxRcN39YAaNkl/exec";

function showForm(){

document.getElementById("formSection").style.display="block";

}

function showLogin(){

document.getElementById("login").style.display="block";

}

function login(){

if(document.getElementById("pass").value=="1234"){

window.open(scriptURL);

}

else{

alert("Wrong password");

}

}

function showDetails(type){

document.getElementById("rental").style.display="none";

document.getElementById("salary").style.display="none";

document.getElementById("uber").style.display="none";

document.getElementById(type).style.display="block";

}

function submitForm(e){

e.preventDefault();

var file=document.getElementById("license").files[0];

var reader=new FileReader();

reader.onload=function(){

var data={

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

city:document.getElementById("city").value,

type:document.getElementById("type").value,

file:reader.result.split(",")[1],

fileName:file.name,

fileType:file.type

};

fetch(scriptURL,{

method:"POST",

body:JSON.stringify(data)

})

.then(res=>alert("Application Submitted Successfully"))

.catch(err=>alert("Upload failed"));

};

</script>



</body>

</html>
