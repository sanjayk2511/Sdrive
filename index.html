<!DOCTYPE html>
<html>

<head>

<title>S-Drive Drivers</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(120deg,#0f172a,#1e293b);
color:white;
}

.header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
text-align:center;
padding:80px 20px;
}

.btn{
background:linear-gradient(90deg,#f97316,#fb923c);
border:none;
padding:14px 28px;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
color:white;
}

.section{
padding:40px;
text-align:center;
}

form{
max-width:420px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,select{
padding:12px;
border-radius:8px;
border:none;
}

.details{
background:white;
color:black;
padding:20px;
margin:20px auto;
max-width:500px;
border-radius:10px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50px;
color:white;
text-decoration:none;
}

.footer{
text-align:center;
padding:20px;
background:black;
margin-top:40px;
}

</style>

</head>

<body>

<div class="header">

S-Drive

</div>



<div class="hero">

<h1>Hire Professional Drivers</h1>

<p>Rental | Salary | Uber Fleet</p>

<button class="btn" onclick="showForm()">Apply Now</button>

</div>



<div id="formSection" class="section" style="display:none;">

<h2>Driver Application</h2>

<form onsubmit="submitForm(event)">

<input id="name" placeholder="Full Name" required>

<input id="phone" placeholder="Phone Number" required>

<input id="city" placeholder="City" required>

<select id="type" onchange="showDetails(this.value)" required>

<option value="">Select Driver Type</option>

<option value="Rental">Rental</option>

<option value="Salary">Salary</option>

<option value="Uber">Uber</option>

</select>

<button class="btn">Submit</button>

</form>

</div>



<div id="Rental" class="details" style="display:none;">
Rental driver flexible earning model
</div>

<div id="Salary" class="details" style="display:none;">
Salary driver fixed monthly income
</div>

<div id="Uber" class="details" style="display:none;">
Uber fleet driver earning model
</div>



<a class="whatsapp" href="https://wa.me/917019300551">

WhatsApp Apply

</a>



<div class="footer">

© S-Drive Driver Services

</div>



<script>

const scriptURL="https://script.google.com/macros/s/AKfycbyeQb9fngVm7yaaiyKgvfC6nl4eAOQNuZNFFoxXCVpjUGaught3VedlEDeCiZ3hXZDgOw/exec";

function showForm(){

document.getElementById("formSection").style.display="block";

}



function showDetails(type){

document.getElementById("Rental").style.display="none";

document.getElementById("Salary").style.display="none";

document.getElementById("Uber").style.display="none";

if(type){

document.getElementById(type).style.display="block";

}

}



function submitForm(e){

e.preventDefault();

var data={

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

city:document.getElementById("city").value,

type:document.getElementById("type").value

};

fetch(scriptURL,{

method:"POST",

body:JSON.stringify(data)

})

.then(res=>alert("Application Submitted Successfully"))

.catch(err=>alert("Error"));

}

</script>

</body>

</html>
